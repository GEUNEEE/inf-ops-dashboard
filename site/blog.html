<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>블로그 현황</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#FAFAF8; --bg2:#F2F0E8; --border:#E5E3D6; --border2:#D3D1C7;
    --text1:#1A1A18; --text2:#666660; --text3:#A8A69C; --r:8px;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --grid:#ECEAE0;
    --ok:#3B6D11; --okbg:#EAF3DE; --warn:#A32D2D; --warnbg:#FCEBEB; --wait:#854F0B; --waitbg:#FAEEDA;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#1A1A18; --bg2:#262624; --border:#3A3A36; --border2:#4A4A44;
      --text1:#F2F0E8; --text2:#B8B6AC; --text3:#7A786E;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#2E2E2B;
      --ok:#A8D57A; --okbg:#24331A; --warn:#F09595; --warnbg:#3A1E1E; --wait:#EDB872; --waitbg:#3A2C16;
    }
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text1);font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;line-height:1.5}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:980px;margin:0 auto;padding:24px 16px}
  .head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .title{font-size:18px;font-weight:600}
  .sub{font-size:11px;color:var(--text3)}
  .chip{font-size:10px;padding:3px 9px;border-radius:11px;border:0.5px solid var(--border2);color:var(--text2);font-weight:500;cursor:pointer;background:transparent}
  .chip.active{background:var(--text1);color:var(--bg);border-color:var(--text1)}
  .slbl{font-size:11px;font-weight:600;color:var(--text2);margin:20px 0 8px}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
  .kpi{background:var(--bg2);border-radius:var(--r);padding:11px 13px}
  .kpi .l{font-size:11px;color:var(--text3)} .kpi .v{font-size:22px;font-weight:500} .kpi .s{font-size:10px;color:var(--text3)}
  .acc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .card{border:0.5px solid var(--border);border-radius:var(--r);padding:12px;background:var(--bg)}
  .card h3{font-size:13px;font-weight:600;display:flex;justify-content:space-between;margin-bottom:8px}
  .cnt.ok{color:var(--ok)} .cnt.bad{color:var(--warn)}
  .post{display:flex;gap:9px;padding:7px 0;border-top:0.5px solid var(--border)}
  .post img,.noimg{width:64px;height:64px;border-radius:6px;object-fit:cover;background:var(--bg2);flex:none}
  .post .t{font-size:12px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .post .m{font-size:11px;color:var(--text3);margin-top:2px}
  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:9px;font-weight:600}
  .tag.ok{background:var(--okbg);color:var(--ok)} .tag.wait{background:var(--waitbg);color:var(--wait)} .tag.bad{background:var(--warnbg);color:var(--warn)}
  .warn{color:var(--warn);font-weight:600;font-size:12px;padding:6px 0}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:6px 8px;border-bottom:0.5px solid var(--border)}
  th{color:var(--text3);font-weight:500;font-size:11px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .tblwrap{overflow-x:auto}
  .daybar{display:flex;gap:5px;flex-wrap:wrap}
  .sum{border:0.5px solid var(--border);border-radius:var(--r);padding:14px 16px;background:var(--bg2);margin-bottom:14px}
  .sum h2{font-size:13px;font-weight:600;margin-bottom:8px}
  .sum ul{list-style:none;display:grid;gap:5px}
  .sum li{font-size:12.5px;display:flex;gap:8px;align-items:baseline}
  .sum li .k{flex:none;width:64px;color:var(--text3);font-size:11px}
  .sum li>span:last-child{min-width:0;overflow-wrap:anywhere}
  .sum b{font-weight:600}
  .sum .bad{color:var(--warn);font-weight:600} .sum .good{color:var(--ok);font-weight:600}
  .vgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px;margin-bottom:8px}
  .chartbox{position:relative;height:240px} .chartbox.tall{height:420px}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--text2);margin-bottom:6px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  .ctitle{font-size:12px;font-weight:600;margin-bottom:6px}
  .view{font-size:11px;color:var(--text2);font-variant-numeric:tabular-nums}
  .up{color:var(--ok);font-weight:600}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
  .rk{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:4px;border:0.5px solid var(--border);color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .rk.top{color:var(--ok);border-color:var(--ok);font-weight:600}
  .dn{color:var(--warn);font-weight:600}
  #ktable td,#ktable th{white-space:nowrap} #ktable td.ttl{white-space:normal;min-width:180px}
  #vtable td a:hover{text-decoration:underline}
  @media (max-width:720px){.vgrid{grid-template-columns:1fr}.chartbox.tall{height:480px}}
  @media (max-width:720px){.acc{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="title">블로그 현황</span>
    <span style="display:flex;gap:10px;align-items:baseline">
      <a class="chip" href="index.html">← 인플루언서</a>
      <span class="sub" id="gen"></span>
    </span>
  </div>

  <div class="sum" id="summary"><h2>요약</h2><div class="sub">불러오는 중…</div></div>
  <div class="daybar" id="days"></div>
  <div class="slbl" id="dayhead"></div>
  <div class="kpis" id="kpis"></div>
  <div class="slbl">계정별 예약·발행</div>
  <div class="acc" id="acc"></div>

  <div class="slbl" id="vhead">조회수</div>
  <div class="kpis" id="vkpis" style="margin-bottom:8px"></div>
  <div class="sum" id="vtrend" style="display:none;padding:10px 14px;margin-bottom:8px"></div>
  <div class="vgrid">
    <div class="card"><div class="ctitle" id="t_donut">계정별 비중</div><div class="legend" id="lg1"></div><div class="chartbox"><canvas id="donut"></canvas></div></div>
    <div class="card"><div class="ctitle" id="t_line">일별 조회수 (블로그 전체 방문 조회)</div><div class="legend" id="lg2"></div><div class="chartbox"><canvas id="line"></canvas></div></div>
  </div>
  <div class="card" style="margin-bottom:8px">
    <div class="ctitle" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><span id="t_bars">글별 조회수</span><span style="display:flex;gap:6px;flex-wrap:wrap"><span class="daybar" id="vmode"></span><span class="daybar" id="vfilter"></span></span></div>
    <div class="legend" id="lg3"></div><div class="chartbox tall"><canvas id="bars"></canvas></div>
  </div>
  <div class="slbl" id="khead">키워드 순위</div>
  <div class="kpis" id="kkpis" style="margin-bottom:8px"></div>
  <div class="card tblwrap" style="margin-bottom:8px">
    <div class="ctitle" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><span>글별 키워드 순위 (좋은 순위부터)</span><span class="daybar" id="kfilter"></span></div>
    <div class="sub" style="margin-bottom:6px">블로그탭 = 네이버 모바일 검색 '블로그' 탭 1페이지(30개) 안 순위 · 통합 = 통합검색 첫 화면에 나온 블로그 글 중 몇 번째 · – = 순위 밖 · ▲▼ = 그 전 측정일 대비 · 매일 08:30 자동 측정</div>
    <table id="ktable"></table></div>

  <div class="card tblwrap"><div class="ctitle" id="t_vtable">글별 조회수 표 (최근 발행순)</div><table id="vtable"></table></div>

  <div class="slbl">블로그 창 로그인 점검</div>
  <div id="login" class="card"></div>

  <div class="slbl">최근 14일 계정별 편수 (목표 하루 3편)</div>
  <div class="card tblwrap"><table id="hist"></table></div>

  <div class="slbl">유료 생성 비용 (크레딧)</div>
  <div class="card tblwrap"><table id="cost"></table></div>
</div>
<script>
const PAGE_VER = "20261112c";
const WEEK = "일월화수목금토";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const md = s => `${s.slice(5,7)}-${s.slice(8,10)}(${WEEK[new Date(s.slice(0,10)+"T00:00").getDay()]})`;
let DATA, SEL;

function status(p) {
  if (!p.url) return ["bad","예약 실패"];
  return new Date(p.publish_at) <= new Date() ? ["ok","발행됨"] : ["wait","예약"];
}

function renderDays() {
  const t = ymd(new Date()), ds = new Set();
  for (let i = 6; i >= -1; i--) { const d = new Date(); d.setDate(d.getDate()-i); ds.add(ymd(d)); }  // 최근 7일 + 다음 날
  DATA.posts.forEach(p => { const d = p.publish_at.slice(0,10); if (d > t) ds.add(d); });            // 예약 잡힌 이후 날짜
  const opts = [["all","📊 전체 요약"], ...[...ds].sort().reverse().map(d => [d, md(d)])];
  document.getElementById("days").innerHTML = opts.map(([d,l]) =>
    `<button class="chip ${d===SEL?"active":""}" data-d="${d}">${l}</button>`).join("");
  document.querySelectorAll("#days .chip").forEach(b => b.onclick = () => { SEL = b.dataset.d; render(); try { renderViews(); } catch (e) { console.error(e); } });
}

function renderSummary() {
  const t = ymd(new Date()); const tmD = new Date(); tmD.setDate(tmD.getDate()+1); const tm = ymd(tmD);
  const tgt = DATA.per_day_target * DATA.accounts.length;
  const dayLine = d => { const ps = DATA.posts.filter(p => p.publish_at.startsWith(d));
    const done = ps.filter(p=>status(p)[0]==="ok").length, wait = ps.filter(p=>status(p)[0]==="wait").length, fail = ps.filter(p=>status(p)[0]==="bad").length;
    const lack = DATA.accounts.filter(a => ps.filter(p=>p.blog_id===a.id).length < DATA.per_day_target).map(a=>a.label.split(" ")[0]);
    return `<b>${ps.length}/${tgt}편</b> · 발행됨 ${done} · 예약 ${wait}${fail?` · <span class="bad">예약 실패 ${fail}</span>`:""}` +
      (lack.length ? ` · <span class="bad">⚠ 부족: ${lack.join("·")}</span>` : ` · <span class="good">계정별 3편 채움</span>`); };
  const li = (k, v) => `<li><span class="k">${k}</span><span>${v}</span></li>`;
  const L = [li(`오늘 ${md(t).slice(0,5)}`, dayLine(t)), li(`내일 ${md(tm).slice(0,5)}`, dayLine(tm))];

  const st = DATA.stats;
  if (st) {
    const ids = DATA.accounts.map(a=>a.id);
    const dates = [...new Set(ids.flatMap(id => (st.accounts[id]?.daily||[]).map(d=>d.date)))].sort();
    const cv = (id,d) => ((st.accounts[id]?.daily||[]).find(x=>x.date===d)||{}).cv ?? 0;
    const sumD = ds => ds.reduce((s,d)=>s+ids.reduce((x,id)=>x+cv(id,d),0),0);
    const w1 = sumD(dates.slice(-7)), w0 = sumD(dates.slice(-14,-7)), pct = w0 ? Math.round((w1-w0)/w0*100) : null;
    const per = ids.map(id => [id, dates.slice(-7).reduce((s,d)=>s+cv(id,d),0)]).sort((a,b)=>b[1]-a[1]);
    const nm = id => DATA.accounts.find(a=>a.id===id).label.split(" ")[0];
    L.push(li("조회수", `오늘 <b>${sumD(dates.slice(-1))}</b> · 어제 ${sumD(dates.slice(-2,-1))} · 최근 7일 <b>${w1}</b>` +
      (pct==null ? "" : ` (전주 대비 <span class="${pct>=0?"good":"bad"}">${pct>=0?"▲":"▼"}${Math.abs(pct)}%</span>)`)));
    L.push(li("블로그별", `최근 7일 ` + per.map(([id,n]) => `${esc(nm(id))} ${n}`).join(" · ")));
    const posts = ids.flatMap(id => st.accounts[id]?.posts||[]);
    const top = [...posts].sort((a,b)=>b.read-a.read)[0];
    if (top) L.push(li("조회 1위 글", `<a href="${esc(top.url)}" target="_blank" rel="noopener"><b>${esc(top.title)}</b></a> · ${esc(nm(top.blog_id))} ${top.read}회`));
    const up = posts.filter(p=>p.delta>0).sort((a,b)=>b.delta-a.delta)[0];
    if (up) L.push(li("어제보다 ↑", `<a href="${esc(up.url)}" target="_blank" rel="noopener">${esc(up.title)}</a> · <span class="good">+${up.delta}</span>`));
  } else L.push(li("조회수", `<span class="sub">아직 수집 전</span>`));

  const kr = DATA.posts.filter(p=>p.ranks).flatMap(p=>p.ranks);
  if (DATA.kwrank) L.push(li("키워드 순위", `블로그탭 10위 안 <b>${kr.filter(r=>r.b&&r.b<=10).length}</b>/${kr.length}개 · 1~3위 <b>${kr.filter(r=>r.b&&r.b<=3).length}</b>개` +
      ` · 새로 진입 <span class="good">${kr.filter(r=>r.b&&r.pb===null).length}</span> · 이탈 <span class="bad">${kr.filter(r=>!r.b&&r.pb&&r.pb!=="new").length}</span>`));
  const lg = DATA.login;
  if (lg) { const bad = Object.entries(lg.accounts).filter(([,v])=>!v.ok).map(([k])=>k);
    L.push(li("로그인", bad.length ? `<span class="bad">로그인 필요: ${esc(bad.join("·"))}</span>` : `<span class="good">3개 모두 정상</span> <span class="sub">(${esc(lg.at.replace("T"," "))})</span>`)); }
  else L.push(li("로그인", `<span class="sub">점검 기록 없음 (매일 08:30 점검)</span>`));

  const cs = DATA.costs || []; const lastBal = [...cs].reverse().find(c => c.balance != null);
  if (lastBal) { const est = lastBal.balance - cs.slice(cs.indexOf(lastBal)+1).reduce((s,c)=>s+(+c.credits||0),0);
    L.push(li("크레딧", `누적 사용 ${cs.reduce((s,c)=>s+(+c.credits||0),0).toFixed(2)} · 잔액(추정) <b>${est.toFixed(2)}</b>`)); }
  document.getElementById("summary").innerHTML = `<h2>요약 <span class="sub" style="font-weight:400">· ${md(t)} 기준</span></h2><ul>${L.join("")}</ul>`;
}

function rkBadge(p) {
  const r = (p.ranks||[]).filter(x=>x.b).sort((a,b)=>a.b-b.b)[0];
  return r ? ` <span class="rk ${r.b<=3?"top":""}" title="블로그탭 순위">${esc(r.kw)} ${r.b}위</span>` : "";
}
const mv = (now, prev) => {  // 순위 변동: 숫자 작을수록 좋음
  if (prev === "new" || prev === undefined) return `<span class="sub">첫 측정</span>`;
  if (now && !prev) return `<span class="up">진입</span>`;
  if (!now && prev) return `<span class="dn">이탈</span>`;
  if (!now) return "–";
  return now < prev ? `<span class="up">▲${prev-now}</span>` : now > prev ? `<span class="dn">▼${now-prev}</span>` : "=";
};
let KF = "rank";
function renderRanks() {
  const km = DATA.kwrank; const head = document.getElementById("khead");
  if (!km) { head.textContent = "키워드 순위 (아직 측정 전)"; return; }
  head.textContent = `키워드 순위 · 측정 ${(km.updated_at||"").replace("T"," ")}`;
  const rows = DATA.posts.filter(p=>p.ranks).flatMap(p=>p.ranks.map((r,i)=>({...r, p, main:i===0})));
  const cnt = f => rows.filter(f).length;
  document.getElementById("kkpis").innerHTML = [
    ["측정 키워드", rows.length, `글 ${DATA.posts.filter(p=>p.ranks).length}편 × 앞 3개`],
    ["블로그탭 1~3위", cnt(r=>r.b&&r.b<=3), "키워드 수"],
    ["블로그탭 10위 안", cnt(r=>r.b&&r.b<=10), "키워드 수"],
    ["통합검색 노출", cnt(r=>r.t), "통합 첫 화면에 보임"],
  ].map(([l,v,s]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${esc(s)}</div></div>`).join("");
  document.getElementById("kfilter").innerHTML = [["rank","순위 있는 것만"],["all","전체"],...DATA.accounts.map(a=>[a.id,a.label.split(" ")[0]])]
    .map(([k,l])=>`<button class="chip ${KF===k?"on":""}" data-k="${k}">${esc(l)}</button>`).join("");
  document.querySelectorAll("#kfilter .chip").forEach(b=>b.onclick=()=>{KF=b.dataset.k; renderRanks();});
  const c = ACOL(), big = 999;
  const list = rows.filter(r => KF==="all" || (KF==="rank" ? (r.b||r.t) : r.p.blog_id===KF))
    .sort((a,b)=>(a.b||big)-(b.b||big) || (a.t||big)-(b.t||big) || b.p.publish_at.localeCompare(a.p.publish_at));
  document.getElementById("ktable").innerHTML = `<tr><th>발행</th><th>계정</th><th>제목</th><th>키워드</th><th class="num">블로그탭</th><th class="num">변동</th><th class="num">통합</th><th class="num">변동</th></tr>` +
    list.map(r=>`<tr><td>${md(r.p.publish_at.slice(0,10))}</td><td><span class="dot" style="background:${c[r.p.blog_id]}"></span>${esc(short(r.p.blog_id))}</td>
      <td class="ttl"><a href="${esc(r.p.url)}" target="_blank" rel="noopener">${esc(r.p.title)}</a></td>
      <td>${esc(r.kw)}${r.main?` <span class="sub">대표</span>`:""}</td>
      <td class="num">${r.b?`<span class="rk ${r.b<=3?"top":""}">${r.b}위</span>`:"–"}</td><td class="num">${mv(r.b,r.pb)}</td>
      <td class="num">${r.t?`${r.t}번째`:"–"}</td><td class="num">${mv(r.t,r.pt)}</td></tr>`).join("");
}

function postRow(p) {
  const [c,l] = status(p);
  const img = p.thumb ? `<img src="${esc(p.thumb)}" alt="" loading="lazy">` : `<div class="noimg"></div>`;
  return `<a class="post" href="${esc(p.url)}" target="_blank" rel="noopener">${img}<div>
    <div class="t">${esc(p.title)}</div>
    <div class="m">${md(p.publish_at.slice(0,10)).slice(0,5)} ${p.publish_at.slice(11,16)} · ${esc(p.post)} <span class="tag ${c}">${l}</span>${p.read!=null?` <span class="view" title="지금까지 누적 조회 (+ = 전 수집 대비)">· 누적 조회 ${p.read}${p.read_delta?` <span class="up">+${p.read_delta}</span>`:""}</span>`:""}${rkBadge(p)}</div></div></a>`;
}
// 전체 요약: 발행 기간 전체 편수·목표 달성·계정별 조회 상위 글
function renderAll() {
  const t = ymd(new Date()), T = DATA.per_day_target, na = DATA.accounts.length;
  const past = DATA.posts.filter(p => p.publish_at.slice(0,10) <= t);
  const d0 = past.map(p=>p.publish_at.slice(0,10)).sort()[0] || t;
  const days = []; for (let d = d0; d <= t; d = shiftD(d,1)) days.push(d);
  const cnt = (d,id) => past.filter(p => p.publish_at.startsWith(d) && (!id || p.blog_id===id)).length;
  const full = days.filter(d => DATA.accounts.every(a => cnt(d,a.id) >= T)).length;
  const fail = DATA.posts.filter(p => status(p)[0]==="bad").length;
  const later = DATA.posts.filter(p => p.publish_at.slice(0,10) > t).length;
  document.getElementById("dayhead").textContent = `📊 전체 요약 · ${md(d0)} ~ ${md(t)} (${days.length}일)`;
  document.getElementById("kpis").innerHTML = [
    ["발행한 글", `${past.length}편`, later ? `오늘 이후 예약 ${later}편 별도` : "오늘까지"],
    ["하루 평균", `${(past.length/days.length).toFixed(1)}편`, `목표 ${T*na}편`],
    ["목표 채운 날", `${full}/${days.length}`, "3개 계정 모두 3편"],
    ["예약 실패", fail, fail ? "아래 날짜별로 확인" : "없음"],
  ].map(([l,v,s]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${esc(s)}</div></div>`).join("");
  document.getElementById("acc").innerHTML = DATA.accounts.map(a => {
    const mine = past.filter(p => p.blog_id===a.id);
    const lack = days.filter(d => cnt(d,a.id) < T).length;
    const reads = mine.reduce((s,p)=>s+(p.read||0),0);
    const top = [...mine].filter(p=>p.read!=null).sort((x,y)=>y.read-x.read).slice(0,3);
    return `<div class="card"><h3><span>${esc(a.label)}</span><span class="cnt ${lack?"bad":"ok"}">${mine.length}편</span></h3>
      <div class="sub" style="margin-bottom:4px">${esc(a.id)} · 글 누적 조회 ${reads} · ${lack ? `3편 못 채운 날 ${lack}일` : "매일 3편 채움"}</div>
      <div class="sub" style="margin:6px 0 2px">조회 많은 글 3</div>${top.map(postRow).join("") || '<div class="sub">조회 기록 없음</div>'}</div>`;
  }).join("");
}

function render() {
  renderDays();
  if (SEL === "all") { renderAll(); renderRest(); return; }
  const posts = DATA.posts.filter(p => p.publish_at.startsWith(SEL));
  const target = DATA.per_day_target * DATA.accounts.length;
  const done = posts.filter(p => status(p)[0]==="ok").length;
  const wait = posts.filter(p => status(p)[0]==="wait").length;
  const short = DATA.accounts.filter(a => posts.filter(p => p.blog_id===a.id).length < DATA.per_day_target);
  document.getElementById("dayhead").textContent = `📅 ${md(SEL)} 발행분`;
  document.getElementById("kpis").innerHTML = [
    ["전체", `${posts.length}/${target}`, "계정 3개 × 3편"],
    ["발행됨", done, "예약 시각 지남"],
    ["예약 대기", wait, "아직 시각 전"],
    ["부족 계정", short.length, short.length ? short.map(a=>a.label.split(" ")[0]).join("·") : "없음"],
  ].map(([l,v,s]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${esc(s)}</div></div>`).join("");

  document.getElementById("acc").innerHTML = DATA.accounts.map(a => {
    const mine = posts.filter(p => p.blog_id===a.id);
    const ok = mine.length >= DATA.per_day_target;
    const rows = mine.map(p => {
      const [c,l] = status(p);
      const img = p.thumb ? `<img src="${esc(p.thumb)}" alt="" loading="lazy">` : `<div class="noimg"></div>`;
      return `<a class="post" href="${esc(p.url)}" target="_blank" rel="noopener">${img}<div>
        <div class="t">${esc(p.title)}</div>
        <div class="m">${p.publish_at.slice(11,16)} · ${esc(p.post)} <span class="tag ${c}">${l}</span>${p.read!=null?` <span class="view" title="지금까지 누적 조회 (+ = 전 수집 대비)">· 누적 조회 ${p.read}${p.read_delta?` <span class="up">+${p.read_delta}</span>`:""}</span>`:""}${rkBadge(p)}</div></div></a>`;
    }).join("");
    return `<div class="card"><h3><span>${esc(a.label)}</span><span class="cnt ${ok?"ok":"bad"}">${mine.length}/${DATA.per_day_target}</span></h3>
      <div class="sub" style="margin-bottom:4px">${esc(a.id)}</div>
      ${rows || ""}${ok ? "" : `<div class="warn">⚠ ${DATA.per_day_target - mine.length}편 부족</div>`}</div>`;
  }).join("");
  renderRest();
}

function renderRest() {
  const lg = DATA.login;
  document.getElementById("login").innerHTML = !lg ? `<div class="sub">아직 점검 기록 없음 (매일 08:30 브리핑 때 점검)</div>` :
    `<div class="sub" style="margin-bottom:6px">마지막 점검 ${esc(lg.at.replace("T"," "))}</div>` +
    Object.entries(lg.accounts).map(([k,v]) =>
      `<div>${esc(k)} · ${esc(v.blog_id)} — ${v.ok ? '<span class="tag ok">로그인됨</span>' : '<span class="tag bad">로그인 필요</span>'}</div>`).join("");

  const days = [];
  for (let i = 13; i >= -1; i--) { const d = new Date(); d.setDate(d.getDate()-i); days.push(ymd(d)); }
  document.getElementById("hist").innerHTML =
    `<tr><th>날짜</th>${DATA.accounts.map(a=>`<th class="num">${esc(a.label.split(" ")[0])}</th>`).join("")}<th class="num">합계</th></tr>` +
    days.reverse().map(d => {
      const ps = DATA.posts.filter(p => p.publish_at.startsWith(d));
      const cells = DATA.accounts.map(a => { const n = ps.filter(p=>p.blog_id===a.id).length;
        return `<td class="num" style="${n<DATA.per_day_target?"color:var(--warn)":""}">${n}</td>`; }).join("");
      return `<tr><td>${md(d)}</td>${cells}<td class="num">${ps.length}</td></tr>`;
    }).join("");

  const cs = DATA.costs || [];
  const total = cs.reduce((s,c)=>s+(+c.credits||0),0);
  const lastBal = [...cs].reverse().find(c => c.balance != null);
  const estBal = lastBal ? lastBal.balance - cs.slice(cs.indexOf(lastBal)+1).reduce((s,c)=>s+(+c.credits||0),0) : null;
  document.getElementById("cost").innerHTML =
    `<tr><th>날짜</th><th>세트</th><th>항목</th><th class="num">크레딧</th></tr>` +
    cs.map(c => `<tr><td>${esc(c.date)}</td><td>${esc(c.set)}</td><td>${esc(c.tool)} — ${esc(c.item)}</td><td class="num">${(+c.credits).toFixed(2)}</td></tr>`).join("") +
    `<tr><td colspan="3"><b>합계</b>${estBal!=null ? ` · 잔액(추정) ${estBal.toFixed(2)}` : ""}</td><td class="num"><b>${total.toFixed(2)}</b></td></tr>`;
}

const CH = {};
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ACOL = () => Object.fromEntries(DATA.accounts.map((a,i)=>[a.id, css(`--s${i+1}`)]));
const short = id => (DATA.accounts.find(a=>a.id===id)||{label:id}).label.split(" ")[0];
let VF = "all";
function legend(el){ const c=ACOL(); document.getElementById(el).innerHTML = DATA.accounts.map(a=>`<span><i style="background:${c[a.id]}"></i>${esc(a.label)}</span>`).join(""); }
function mk(id, cfg){ if (CH[id]) CH[id].destroy(); CH[id] = new Chart(document.getElementById(id), cfg); }

const shiftD = (d,n) => { const x = new Date(d+"T00:00"); x.setDate(x.getDate()+n); return ymd(x); };
const rangeD = (end,n) => Array.from({length:n}, (_,i) => shiftD(end, i-n+1));
let VM = "gain";
function renderViews(){
  const st = DATA.stats; if (!st || typeof Chart === "undefined") { document.getElementById("vhead").textContent = st ? "조회수 (차트 라이브러리 로딩 실패)" : "조회수 (아직 수집 전)"; return; }
  const c = ACOL(), t2 = css("--text2"), t3 = css("--text3"), grid = css("--grid"), surf = css("--bg"), FF = getComputedStyle(document.body).fontFamily;
  Chart.defaults.font.family = FF; Chart.defaults.color = t2;
  const ids = DATA.accounts.map(a=>a.id);
  const allDates = [...new Set(ids.flatMap(id => (st.accounts[id]?.daily||[]).map(d=>d.date)))].sort();
  const cv = (id,d) => ((st.accounts[id]?.daily||[]).find(x=>x.date===d)||{}).cv ?? 0;
  const sumD = ds => ds.reduce((s,d)=>s+ids.reduce((t,id)=>t+cv(id,d),0),0);
  const last = allDates.at(-1), first = allDates[0], today = ymd(new Date());
  // 기준일 D = 선택한 날짜. 아직 집계 안 된 날(내일 이후)이면 마지막 수집일로.
  const ALL = SEL === "all";
  const D = ALL || SEL > last ? last : SEL;
  const note = ALL ? "" : SEL > last ? ` · ${md(SEL)} 아직 집계 전 → 마지막 수집일 기준` : SEL < first ? ` · ${md(first)} 이전 기록 없음` : "";
  document.getElementById("vhead").innerHTML = (ALL ? `조회수 · <b>전체 흐름</b> ${md(first)} ~ ${md(last)} (${allDates.length}일)` : `조회수 · <b>${md(D)}</b> 기준${esc(note)}`) +
    ` <span class="sub" style="font-weight:400">· 위 날짜를 누르면 바뀜 · 수집 ${esc((st.updated_at||"").replace("T"," "))}</span>`;

  // 흐름(추세): 끝난 날만 사용(오늘은 진행 중이라 제외). 최근 7일 평균 vs 그 전 7일 평균, ±10% 안이면 보합
  const done = allDates.filter(d => d < today);
  const avgOf = (ds, f) => ds.length ? ds.reduce((s,d)=>s+f(d),0)/ds.length : 0;
  const trend = f => { const a1 = avgOf(done.slice(-7), f), a0 = avgOf(done.slice(-14,-7), f);
    const r = a0 ? (a1-a0)/a0 : null;
    const dir = r==null ? (a1>0?"up":"flat") : r>0.1 ? "up" : r<-0.1 ? "down" : "flat";
    return {a1, a0, r, dir, txt: {up:"▲ 상승", down:"▼ 하락", flat:"＝ 보합"}[dir]}; };
  const totF = d => ids.reduce((t,id)=>t+cv(id,d),0);
  const vt = document.getElementById("vtrend");
  if (ALL) {
    const T0 = trend(totF), cls = x => x.dir==="up" ? "good" : x.dir==="down" ? "bad" : "";
    const ln = (nm, x) => `<b>${esc(nm)}</b> <span class="${cls(x)}">${x.txt}</span> <span class="sub">하루 평균 ${x.a0.toFixed(1)} → ${x.a1.toFixed(1)}회${x.r!=null&&x.a0*7>=20?` (${x.r>=0?"+":""}${Math.round(x.r*100)}%)`:""}</span>`;
    vt.style.display = "";
    vt.innerHTML = `<div style="font-size:12.5px;line-height:1.9">흐름 · ${ln("전체", T0)}<br>` +
      ids.map(id => ln(short(id), trend(d => cv(id,d)))).join(" &nbsp;·&nbsp; ") +
      `<br><span class="sub">최근 7일(${md(done.at(-7)||first).slice(0,5)}~${md(done.at(-1)||last).slice(0,5)}) 평균을 그 전 7일 평균과 비교 · ±10% 안이면 보합 · 그 전 7일 합이 20 미만이면 % 생략 · 오늘은 하루가 안 끝나서 제외</span></div>`;
  } else vt.style.display = "none";

  const dayV = sumD([D]), prevV = sumD([shiftD(D,-1)]), dd = dayV - prevV;
  const w1 = sumD(rangeD(D,7)), w0 = sumD(rangeD(shiftD(D,-7),7));
  const pct = w0 >= 20 ? Math.round((w1-w0)/w0*100) : null;  // 기준이 너무 작으면 % 생략 (12→162가 ▲1250%로 보이는 문제)
  const perD = ids.map(id => [id, cv(id,D)]).sort((a,b)=>b[1]-a[1]);
  const lbl = md(D).slice(0,5);
  if (ALL) {
    const T0 = trend(totF), best = [...done].sort((a,b)=>totF(b)-totF(a))[0];
    const tot = sumD(allDates);
    document.getElementById("vkpis").innerHTML = [
      ["전체 기간 조회수", tot, `${md(first).slice(0,5)}~${md(last).slice(0,5)} · 3개 합계`],
      ["흐름", T0.txt, `최근 7일 하루 ${T0.a1.toFixed(1)}회 · 그 전 ${T0.a0.toFixed(1)}회`],
      ["최근 7일 합계", sumD(done.slice(-7)), `그 전 7일 ${sumD(done.slice(-14,-7))}`],
      ["가장 많은 날", best ? totF(best) : "–", best ? md(best) : "기록 없음"],
    ].map(([l,v,s]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${esc(s)}</div></div>`).join("");
  } else
  document.getElementById("vkpis").innerHTML = [
    [`${lbl} 조회수`, dayV, D===today ? "오늘 수집 시점까지 · 3개 합계" : "3개 블로그 합계"],
    ["전날 대비", (dd>=0?"▲ ":"▼ ")+Math.abs(dd), `${md(shiftD(D,-1))} ${prevV}회`],
    [`${lbl}까지 7일`, w1, pct==null ? `그 전 7일 ${w0}` : `그 전 7일 ${w0} · ${pct>=0?"▲":"▼"}${Math.abs(pct)}%`],
    ["그날 1위 블로그", dayV ? short(perD[0][0]) : "–", dayV ? `${perD[0][1]}회 (${Math.round(perD[0][1]/dayV*100)}%)` : "조회 없음"],
  ].map(([l,v,s]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${esc(s)}</div></div>`).join("");

  // 도넛: 선택일 계정별 비중 (그날 0이면 그날까지 7일)
  const dd7 = ALL ? allDates : dayV ? [D] : rangeD(D,7), tot = ids.map(id => dd7.reduce((s,d)=>s+cv(id,d),0)), all = tot.reduce((a,b)=>a+b,0);
  const dlabel = ALL ? "전체 기간" : dayV ? `${lbl} 하루` : `${lbl}까지 7일`;
  document.getElementById("t_donut").textContent = `${dlabel} 조회수 · 계정별 비중`;
  legend("lg1");
  mk("donut", {type:"doughnut", data:{labels:ids.map(short), datasets:[{data:tot, backgroundColor:ids.map(id=>c[id]), borderColor:surf, borderWidth:2, borderRadius:4, hoverOffset:4}]},
    options:{maintainAspectRatio:false, cutout:"62%", plugins:{legend:{display:false},
      tooltip:{callbacks:{label:x=>` ${x.label} ${x.raw}회 (${all?Math.round(x.raw/all*100):0}%)`}}}},
    plugins:[{id:"center", afterDraw(ch){ const {ctx,chartArea:a}=ch; const cx=(a.left+a.right)/2, cy=(a.top+a.bottom)/2; ctx.save(); ctx.textAlign="center";
      ctx.fillStyle=css("--text1"); ctx.font="600 22px "+FF; ctx.fillText(all,cx,cy+4);
      ctx.fillStyle=t3; ctx.font="11px "+FF; ctx.fillText(dlabel,cx,cy+22); ctx.restore(); }},
      {id:"lbl", afterDatasetsDraw(ch){ const {ctx}=ch; ctx.save(); ctx.font="600 11px "+FF; ctx.fillStyle="#fff"; ctx.textAlign="center";
      ch.getDatasetMeta(0).data.forEach((arc,i)=>{ if(!all||tot[i]/all<0.08) return; const p=arc.tooltipPosition(); ctx.fillText(Math.round(tot[i]/all*100)+"%",p.x,p.y+4); }); ctx.restore(); }}]});

  // 선: 기준일까지 15일, 기준일 세로 띠로 표시
  const dates = ALL ? allDates : rangeD(D,15).filter(d => d >= first);
  const hi = ALL ? -1 : dates.indexOf(D);
  document.getElementById("t_line").textContent = `일별 조회수 (블로그 전체 방문 조회) · ${md(dates[0]).slice(0,5)}~${lbl}` + (ALL ? " · 점선 = 3개 합계 7일 평균" : "");
  legend("lg2");
  if (ALL) document.getElementById("lg2").innerHTML += `<span><i style="background:transparent;border-top:2px dashed ${t2};height:0;border-radius:0"></i>합계 7일 평균</span>`;
  const ma = dates.map((d,i) => { const w = dates.slice(Math.max(0,i-6), i+1).filter(x => x < today); return w.length ? +(w.reduce((s,x)=>s+totF(x),0)/w.length).toFixed(1) : null; });
  const lineSets = ids.map(id=>({label:short(id), data:dates.map(d=>cv(id,d)),
      borderColor:c[id], backgroundColor:c[id], borderWidth:2, pointRadius:dates.map((d,i)=>i===hi?4:0), pointBorderColor:surf, pointBorderWidth:2,
      pointHitRadius:12, pointHoverRadius:5, pointHoverBorderColor:surf, pointHoverBorderWidth:2, tension:0.25}));
  if (ALL) lineSets.push({label:"합계 7일 평균", data:ma, borderColor:t2, backgroundColor:t2, borderWidth:2, borderDash:[5,4], pointRadius:0, pointHitRadius:12, pointHoverRadius:4, tension:0.3, spanGaps:true});
  mk("line", {type:"line", data:{labels:dates.map(d=>d.slice(5).replace("-","/")), datasets:lineSets},
    options:{maintainAspectRatio:false, interaction:{mode:"index", intersect:false},

    plugins:[{id:"selband", beforeDatasetsDraw(ch){ if (hi<0) return; const {ctx,chartArea:a,scales:{x}}=ch; const step = dates.length>1 ? (x.getPixelForValue(1)-x.getPixelForValue(0)) : 30;
      const px = x.getPixelForValue(hi); ctx.save(); ctx.fillStyle = css("--grid"); ctx.globalAlpha = 0.9; ctx.fillRect(px-step/2, a.top, step, a.bottom-a.top); ctx.restore(); }}]});

  // 글별: 기준일(또는 그 전) 마지막 수집 스냅샷 기준
  const SN = st.snap || {}, SA = st.snap_at || {}, snaps = Object.keys(SN).sort();
  const sD = [...snaps].reverse().find(d => d <= D) || snaps[0];

  const vm = sP ? VM : "total";

  const snapNote = !sD ? "글별 기록 없음" : (sD !== D ? `${md(D).slice(0,5)} 글별 기록 없음 → ${at(sD)} 수집 기준` : `${at(sD)} 수집 기준`);
  document.getElementById("t_bars").textContent = (vm==="gain"

  legend("lg3");
  const cut = s => s.length>24 ? s.slice(0,23)+"…" : s;
  mk("bars", {type:"bar", data:{labels:top.map(p=>cut(p.title)), datasets:[{data:top.map(val), backgroundColor:top.map(p=>c[p.blog_id]),
      borderRadius:{topRight:4,bottomRight:4}, borderSkipped:"start", barPercentage:0.72, categoryPercentage:0.9}]},
    options:{indexAxis:"y", maintainAspectRatio:false, layout:{padding:{right:36}},
      onClick:(e,el)=>{ if(el[0]) window.open(top[el[0].index].url,"_blank"); },
      onHover:(e,el)=>{ e.native.target.style.cursor = el.length?"pointer":"default"; },
      plugins:{legend:{display:false}, tooltip:{callbacks:{title:x=>top[x[0].dataIndex].title,
        label:x=>{const p=top[x.dataIndex]; return [` ${short(p.blog_id)} · ${at(sD)} 누적 ${p.r}회${p.g!=null?` (전 수집 대비 +${p.g})`:""}`, ` ${md(p.added.slice(0,10))} 발행`];}}}},
      scales:{x:{beginAtZero:true, grid:{color:grid}, border:{display:false}, ticks:{color:t3, precision:0}}, y:{grid:{display:false}, ticks:{color:t2, font:{size:11}}}}},
    plugins:[{id:"val", afterDatasetsDraw(ch){ const {ctx}=ch; ctx.save(); ctx.fillStyle=t2; ctx.font="11px "+FF; ctx.textBaseline="middle";
      ch.getDatasetMeta(0).data.forEach((b,i)=>ctx.fillText((vm==="gain"?"+":"")+val(top[i]), b.x+5, b.y)); ctx.restore(); }}]});

  // 표: 기준일까지 발행한 글, 기준 스냅샷 누적 + 전 수집 대비
  document.getElementById("t_vtable").textContent = `글별 조회수 표 · ${md(D).slice(0,5)}까지 발행한 글 · ${snapNote} (최근 발행순)`;
  const rows = [...mine].sort((a,b)=>b.added.localeCompare(a.added));
  document.getElementById("vtable").innerHTML = `<tr><th>발행</th><th>계정</th><th>제목</th><th class="num">누적 조회</th><th class="num">전 수집 대비</th><th class="num">공감</th><th class="num">댓글</th></tr>` +
    (rows.length ? rows.map(p=>`<tr><td style="white-space:nowrap">${md(p.added.slice(0,10))}${!ALL&&p.added.slice(0,10)===D?' <span class="tag ok">그날 발행</span>':""}</td><td style="white-space:nowrap"><span class="dot" style="background:${c[p.blog_id]}"></span>${esc(short(p.blog_id))}</td>
      <td><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></td><td class="num">${p.r}</td>
      <td class="num">${p.g==null?"–":p.g>0?`<span class="up">+${p.g}</span>`:p.g}</td><td class="num">${p.like}</td><td class="num">${p.comment}</td></tr>`).join("")
      : `<tr><td colspan="7" class="sub">이 날짜 기준 글별 기록 없음</td></tr>`) +
    `<tr><td colspan="7" class="sub">공감·댓글은 지금 값 · 글별 조회는 수집할 때마다(매일 08:30 브리핑·예약 직후) 누적값을 남겨 비교함</td></tr>`;
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => DATA && renderViews());

fetch("data/blog/blog.json?" + Date.now()).then(r => r.json()).then(d => {
  if (d.page_ver && d.page_ver !== PAGE_VER && !location.search.includes("v="+d.page_ver)) { location.replace("blog.html?v=" + d.page_ver); return; }  // 브라우저에 남은 옛 페이지면 새로 받기
  DATA = d; SEL = ymd(new Date());
  document.getElementById("gen").textContent = "갱신 " + d.generated_at.replace("T"," ");
  render();
  try { renderSummary(); } catch (e) { console.error(e); }
  try { renderViews(); } catch (e) { console.error(e); document.getElementById("vhead").textContent = "조회수 그래프 오류: " + e; }
  try { renderRanks(); } catch (e) { console.error(e); document.getElementById("khead").textContent = "키워드 순위 오류: " + e; }
}).catch(e => { document.getElementById("acc").innerHTML = `<div class="warn">데이터를 불러오지 못했습니다: ${esc(e)}</div>`; });
</script>
</body>
</html>
